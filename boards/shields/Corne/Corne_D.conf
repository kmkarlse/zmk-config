# --- Corne dongle: BLE central, USB-wired to the host ---
# Third nRF52840; both halves are now peripherals. Central role +
# keyboard name are set in Kconfig.defconfig (SHIELD_CORNE_D).

# Connect to BOTH halves. Default is 1 peripheral; the central-role
# defaults already bump BT_MAX_CONN/PAIRED to 6, so no BT tuning needed.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# No battery on the dongle (USB powered). Don't advertise a bogus level
# to the host and skip the battery sensor entirely.
CONFIG_ZMK_BATTERY_REPORTING=n

# Never sleep: the dongle is always USB-powered and is the host's only
# link to the keyboard. Deep sleep (sys_poweroff) would drop the USB +
# split connections, so disable ZMK sleep here. The halves keep sleep
# enabled for battery life (Corne_{L,R}.conf).
CONFIG_ZMK_SLEEP=n

# No display + no RGB strip on the dongle: ZMK_DISPLAY / WS2812 are only
# enabled in the halves' confs, so they stay off here. rgb_reactive.c
# isn't compiled (no strip); behavior_rgb_reactive.c still is (central),
# to forward layer broadcasts to both halves. See CMakeLists.txt.
