# RGB — see Corne_L.conf. Same custom controller runs on both halves;
# central drives it via a BEHAVIOR_LOCALITY_GLOBAL invocation.
CONFIG_ZMK_RGB_UNDERGLOW=n
# See Corne_L.conf for why both LED_STRIP and WS2812_STRIP are needed.
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y
CONFIG_SPI=y
CONFIG_WS2812_STRIP_SPI=y

# --- Battery + sleep (this half runs on LiPo) ---
# Battery reporting is also required by nice_oled (its screens reference
# the battery API unconditionally — link errors otherwise).
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SLEEP=y

# OLED display — widgets and status screen handled by the nice_oled shield
# (see build.yaml: "Corne_R nice_oled").
CONFIG_ZMK_DISPLAY=y

# Peripheral animations: all off. nice_oled's screen_peripheral always
# draws background + output status (BT/USB) + battery %. With every
# animation flag disabled the screen is static — no per-frame OLED
# refreshes, much less power on battery.
#
# Must disable the master switch (_PERIPHERAL=n), not just the children.
# _PERIPHERAL_MS (animation length) has only conditional defaults — one
# per animation type. With every child =n it gets no value, and Zephyr's
# generated configs.c then emits an empty int that the assembler chokes
# on ("missing expression"). The master switch gates _MS out entirely.
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_GEM=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SPACEMAN=n
