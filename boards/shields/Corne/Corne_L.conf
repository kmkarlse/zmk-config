# RGB — custom controller in rgb_reactive.c owns the strip on both halves.
# Built-in rgb_underglow is intentionally disabled (its 50ms render loop
# would clobber our per-key flash writes). The WS2812 SPI driver still
# needs to be on for our controller to talk to the strip.
CONFIG_ZMK_RGB_UNDERGLOW=n
# LED_STRIP was previously pulled in via `select LED_STRIP` on
# ZMK_RGB_UNDERGLOW. Now that we've disabled rgb_underglow, nothing
# selects it, and WS2812_STRIP is gated behind `if LED_STRIP` in
# Zephyr's Kconfig — so WS2812_STRIP=y silently does nothing without
# this line. Enable both explicitly.
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y
# WS2812_STRIP only gates the menu. WS2812_STRIP_SPI is the SPI
# backend (matches our DT compatible "worldsemi,ws2812-spi") and it
# `depends on SPI`, so CONFIG_SPI must be on or WS2812_STRIP_SPI is
# silently invisible. With ZMK_RGB_UNDERGLOW=y the SPI subsystem was
# pulled in transitively; now we have to ask for it ourselves.
CONFIG_SPI=y
CONFIG_WS2812_STRIP_SPI=y

# OLED display — widgets and status screen handled by the nice_oled shield
# (see build.yaml: "Corne_L nice_oled").
CONFIG_ZMK_DISPLAY=y

# nice_oled central widgets — both default y in the module's Kconfig.defconfig,
# set explicitly here to make the intent visible.
CONFIG_NICE_OLED_WIDGET_LAYER=y
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=y
