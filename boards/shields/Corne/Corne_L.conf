# RGB underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=60

# OLED display
CONFIG_ZMK_DISPLAY=y

# Custom status screen (layer name top + output status bottom)
# CUSTOM disables ZMK's built-in screen; we provide zmk_display_status_screen()
# in central_status_screen.c. Implies don't fire with CUSTOM, so the widget
# configs and theme/label features are set explicitly.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_THEME_MONO=y
CONFIG_LV_Z_MEM_POOL_SIZE=4096
