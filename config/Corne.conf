# --- Display widget tweaks ---
# https://zmk.dev/docs/config/displays
CONFIG_ZMK_WIDGET_WPM_STATUS=n
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=n

# Don't pull in the big LVGL fonts
CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_26=n
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_26=n

# --- USB + split (explicit, also defaulted by shield) ---
CONFIG_ZMK_USB=y
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y

# --- BLE TX power ---
# PandaKB stock pins this to +8 dBm (max) to guarantee L<->R sync in
# any environment. Dropped to 0 dBm (Zephyr default, 1 mW) — plenty
# for halves on the same desk + host nearby, ~3x less average TX
# current. Revert to CONFIG_BT_CTLR_TX_PWR_PLUS_8=y if L<->R gets flaky.
CONFIG_BT_CTLR_TX_PWR_0=y

# --- Debounce (matches PandaKB stock) ---
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# --- Battery + power management (now per-shield) ---
# Battery reporting and ZMK_SLEEP are set per-shield, NOT here:
#   - boards/shields/Corne/Corne_{L,R}.conf  → both =y (LiPo halves)
#   - boards/shields/Corne/Corne_D.conf      → both =n (USB dongle; it
#     has no battery and must never deep-sleep or it drops the host link)
# They're kept out of this shared file because the user config conf is
# applied last and would otherwise clobber the dongle's =n overrides.
# (WIDGET_BATTERY_STATUS is a display widget — harmless everywhere.)
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n

# --- ZMK Studio ---
CONFIG_ZMK_STUDIO=y

# --- LED ---
# RGB underglow is enabled per-shield in boards/shields/Corne/Corne_{L,R}.conf
