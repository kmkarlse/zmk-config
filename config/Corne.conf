# --- Display widget tweaks ---
# https://zmk.dev/docs/config/displays
CONFIG_ZMK_WIDGET_WPM_STATUS=n
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=n

# Don't pull in the big LVGL fonts
CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_26=n
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_26=n

# --- USB + split (explicit, also defaulted by shield) ---
CONFIG_ZMK_USB=y
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y

# --- BLE link tuning (matches PandaKB stock; fixes flaky L<->R) ---
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- Debounce (matches PandaKB stock) ---
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# --- Battery ---
# Wireless build with LiPo on each half. Reporting also required by
# nice_oled's widgets/screen{,_peripheral}.c (they reference the battery
# API unconditionally — link errors against zmk_event_zmk_battery_state_changed,
# zmk_battery_state_of_charge, etc. otherwise).
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n

# --- Power management ---
# Idle (default 30s of no keypress): rgb_reactive blanks the strip and
# stops ticking, OLED/display blanks, BLE intervals relax. MCU still up.
# Deep sleep (default 15min after idle): MCU powers off via sys_poweroff;
# any keypress wakes. ZMK_SLEEP applies per-half — each side tracks its
# own activity from its local keyscan, so the half you stop touching
# goes to sleep on its own timer.
CONFIG_ZMK_SLEEP=y

# --- ZMK Studio ---
CONFIG_ZMK_STUDIO=y

# --- LED ---
# RGB underglow is enabled per-shield in boards/shields/Corne/Corne_{L,R}.conf
