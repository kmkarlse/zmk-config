# This file generates the GitHub Actions matrix.
---
include:
  # Dongle = sole BLE central, USB to host. Studio talks to the central,
  # so the studio snippet lives here now (moved off Corne_L).
  - board: nice_nano_v2
    shield: Corne_D
    snippet: studio-rpc-usb-uart
  # Both halves are peripherals (no central role).
  - board: nice_nano_v2
    shield: Corne_L nice_oled
  - board: nice_nano_v2
    shield: Corne_R nice_oled
  - board: nice_nano_v2
    shield: settings_reset
